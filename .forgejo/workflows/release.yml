# Builds the mycelium-core Docker image on every `vX.Y.Z` tag and pushes it to
# a container registry as:
#
#   <REGISTRY>/<IMAGE_PATH>:X.Y.Z
#   <REGISTRY>/<IMAGE_PATH>:latest
#
# This is a Forgejo Actions workflow (a public GitHub mirror runs .github/
# instead). By default it publishes to this instance's own container registry
# ( <this Forgejo host>/<owner>/mycelium ) — nothing to configure. Override the
# target with two Forgejo repo/org variables if you want a different registry:
#
#   vars.RELEASE_REGISTRY    e.g. registry.example.com
#   vars.RELEASE_IMAGE_PATH  e.g. you/mycelium
#
# Needs: secrets.RELEASE_TOKEN — a PAT with container-registry write + repo
# write; and an Actions runner labelled `docker` whose jobs can run
# `docker build` / `docker push` (config.yml: container.docker_host: automount).
#
# stipes-sdk is vendored in-repo at third_party/stipes-sdk (go.mod:
# replace github.com/Lotho33/stipes-sdk => ./third_party/stipes-sdk), so the
# build needs only this one repo — no sibling checkout.

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: docker
    container:
      image: docker:27-cli

    steps:
      - name: Tools
        run: apk add --no-cache git curl jq

      - name: Resolve registry / image
        id: reg
        run: |
          # explicit override, else derive from this instance + repo owner
          registry='${{ vars.RELEASE_REGISTRY }}'
          image_path='${{ vars.RELEASE_IMAGE_PATH }}'
          if [ -z "$registry" ]; then
            server='${{ github.server_url }}'; registry="${server#https://}"; registry="${registry#http://}"
          fi
          if [ -z "$image_path" ]; then
            owner='${{ github.repository_owner }}'
            image_path="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')/mycelium"
          fi
          echo "registry=$registry"       >> "$GITHUB_OUTPUT"
          echo "image=$registry/$image_path" >> "$GITHUB_OUTPUT"
          echo "→ $registry/$image_path"
          if ! docker version >/dev/null 2>&1; then
            echo "::error::this runner's job container has no working Docker daemon (need config.yml container.docker_host: automount)"
            exit 1
          fi

      - name: Derive version
        id: v
        run: |
          tag="${{ github.ref_name }}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag (git, no JS action)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          server='${{ github.server_url }}'
          host="${server#https://}"
          auth="https://${{ github.actor }}:${RELEASE_TOKEN}@${host}"
          tag='${{ github.ref_name }}'

          git config --global --add safe.directory '*'
          mkdir -p /work && cd /work
          git init -q src
          git -C src remote add origin "${auth}/${{ github.repository }}.git"
          git -C src fetch -q --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git -C src checkout -q "refs/tags/${tag}"

      - name: Registry login
        run: |
          printf '%s' '${{ secrets.RELEASE_TOKEN }}' \
            | docker login "${{ steps.reg.outputs.registry }}" -u '${{ github.actor }}' --password-stdin

      - name: Build
        run: |
          docker build \
            --build-arg VERSION='${{ steps.v.outputs.name }}' \
            -t "${{ steps.reg.outputs.image }}:${{ steps.v.outputs.name }}" \
            -t "${{ steps.reg.outputs.image }}:latest" \
            /work/src

      - name: Push
        run: |
          docker push "${{ steps.reg.outputs.image }}:${{ steps.v.outputs.name }}"
          docker push "${{ steps.reg.outputs.image }}:latest"

      - name: Forgejo release notes
        run: |
          set -eu
          api='${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
          tag='${{ github.ref_name }}'
          hdr="Authorization: token ${{ secrets.RELEASE_TOKEN }}"
          ver='${{ steps.v.outputs.name }}'

          body=$(printf 'Docker image:\n\n```\ndocker pull %s:%s\n```\n\nAlso published as `%s:latest`.\n' "${{ steps.reg.outputs.image }}" "$ver" "${{ steps.reg.outputs.image }}")

          rel_id=$(curl -sf -H "$hdr" "$api/releases/tags/${tag}" | jq -r '.id // empty' || true)
          if [ -z "$rel_id" ]; then
            curl -sf -H "$hdr" -H 'Content-Type: application/json' -X POST "$api/releases" \
              -d "$(jq -nc --arg t "$tag" --arg b "$body" '{tag_name:$t, name:$t, body:$b}')" \
              >/dev/null
            echo "created release $tag"
          else
            echo "release $tag already exists (id $rel_id) — left as is"
          fi
